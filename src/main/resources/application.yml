server:
  port: ${SERVER_PORT:8091}

spring:
  application:
    name: premisave-developer-service
  config:
    # Reads a .env file from the folder the service is started in, if there is one. Real environment variables win over it.
    import: optional:file:./.env[.properties]
  data:
    mongodb:
      auto-index-creation: true
  servlet:
    multipart:
      # Business documents are uploaded as form files. The service refuses more than 5 MB per document.
      max-file-size: 8MB
      max-request-size: 9MB
  mail:
    # The mail server, in the same form as the wallet service. Each value comes from a MAIL_* name in capital
    # letters, from .env or the environment. With no username nothing is sent: mail counts as off.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
          # So a server that does not answer cannot hold a thread forever.
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/premisave_developer}

developer:
  jwt:
    secret: ${DEVELOPER_JWT_SECRET}
    issuer: premisave-developer
    access-ttl-minutes: 60
  keys:
    pepper: ${API_KEY_PEPPER}
    max-active-per-app: 5
    rotation-grace-hours: 24
  wallet:
    base-url: ${WALLET_SERVICE_URL:http://localhost:8084}
    # live-url and sandbox-url are only needed if the two environments run as separate wallet deployments
    api-key: ${INTERNAL_API_KEY}
    # Set the same value in the wallet service's commercial.signing.secrets when request signing is on there
    signing-secret: ${WALLET_SIGNING_SECRET:}
    timeout-seconds: 30
  proxy:
    rate-limit-per-minute: 600
    max-body-bytes: 1048576
    max-upload-bytes: 12582912
  businesses:
    max-per-developer: ${DEVELOPER_MAX_BUSINESSES:10}
  apps:
    max-per-environment: 10
    sync-interval-ms: 30000
    test-merchant-numbers:
      - PRM-TEST-0001
      - PRM-TEST-0002
      - PRM-TEST-0003
      - PRM-TEST-0004
      - PRM-TEST-0005
  security:
    max-failed-logins: 5
    lock-minutes: 15
    password-min-length: 10
    pbkdf2-iterations: 210000
  internal:
    api-key: ${DEVELOPER_INTERNAL_API_KEY:}
  cors:
    allowed-origins: ${DEVELOPER_PORTAL_ORIGINS:}
  cloudinary:
    # Profile pictures are stored in Cloudinary. Find the three values on the Cloudinary dashboard. With any of them
    # empty, profile pictures are switched off and everything else works. Pictures go under folder/developerId.
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:premisave/developers}
    # Largest picture accepted. 5 MB by default, never more than 10 MB.
    max-bytes: ${CLOUDINARY_MAX_BYTES:5242880}
  mail:
    # Sender address on verification and reset emails. When empty the mail server decides (usually the login user).
    from: ${DEVELOPER_MAIL_FROM:}
    # Where the portal runs. Emails link to {portal-base-url}/verify-email?token=... and /reset-password?token=...
    portal-base-url: ${DEVELOPER_PORTAL_URL:http://localhost:3000}
    verification-ttl-hours: 24
    reset-ttl-minutes: 60
    resend-cooldown-seconds: 60
    max-per-hour: 5
    # A developer must confirm their email before creating a business
    require-verified-for-business: true
    # Development only: write the links to the log when no mail server is set. Never enable in production.
    log-links: ${DEVELOPER_MAIL_LOG_LINKS:false}
    # Email the owner on every successful sign in, with the time, device and network address
    notify-sign-in: ${DEVELOPER_MAIL_NOTIFY_SIGN_IN:true}
    # Checks the mail settings after the service has started and writes the result to the log: whether mail is on,
    # whether the mail server accepts the login, and, if send-test-to is an address, sends one test email there.
    # It never stops the service from starting. Turn it off once mail works.
    startup-check:
      enabled: ${DEVELOPER_MAIL_STARTUP_CHECK:false}
      send-test-to: ${DEVELOPER_MAIL_STARTUP_CHECK_SEND_TO:}
  oauth:
    # Social sign in. The browser gets the provider's token and posts it to this service, which checks it with the
    # provider. Google is on with a client id alone. Facebook and GitHub need the client id and the secret.
    # The endpoint addresses default to the providers' standard ones; override them only to pin a version
    # (for example Facebook's Graph API version).
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
    facebook:
      client-id: ${FACEBOOK_CLIENT_ID:}
      client-secret: ${FACEBOOK_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
