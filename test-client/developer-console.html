<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premisave Developer Console</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --sunken: #eef0f4;
  --ink: #0f172a;
  --ink-2: #475467;
  --ink-3: #8792a2;
  --line: #e4e7ec;
  --line-2: #d0d5dd;
  --accent: #2d5bff;
  --accent-ink: #ffffff;
  --side: #0e1a33;
  --side-2: #16264a;
  --side-ink: #d5dcec;
  --side-ink-2: #7f8cab;
  --good: #11805a;
  --bad: #c0261d;
  --warn: #9a5b00;
  --info: #1d5fd1;
  --code-bg: #0b1220;
  --code-ink: #d6deee;
  --ring: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  --shadow: 0 1px 2px rgba(15, 23, 42, .05);
  --pop: 0 12px 32px rgba(15, 23, 42, .18);
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0e15;
  --surface: #111722;
  --surface-2: #151c29;
  --sunken: #0d121b;
  --ink: #e6eaf2;
  --ink-2: #9aa5b8;
  --ink-3: #667085;
  --line: #1e2736;
  --line-2: #2a3548;
  --accent: #7c9bff;
  --accent-ink: #0a1020;
  --side: #0c111b;
  --side-2: #151d2c;
  --side-ink: #cfd7e6;
  --side-ink-2: #6f7c95;
  --good: #3ddc9b;
  --bad: #ff8a80;
  --warn: #f2b84b;
  --info: #7fb2ff;
  --code-bg: #080c13;
  --code-ink: #d2dbec;
  --shadow: none;
  --pop: 0 12px 32px rgba(0, 0, 0, .55);
}
/* accent palettes, light then dark */
:root[data-accent="emerald"] { --accent: #0b8f66; }
:root[data-accent="violet"] { --accent: #6a4dff; }
:root[data-accent="graphite"] { --accent: #1f2937; }
:root[data-theme="dark"][data-accent="blue"] { --accent: #7c9bff; }
:root[data-theme="dark"][data-accent="emerald"] { --accent: #3ddc9b; }
:root[data-theme="dark"][data-accent="violet"] { --accent: #a99aff; }
:root[data-theme="dark"][data-accent="graphite"] { --accent: #cdd5e2; }
:root[data-theme="dark"][data-accent="emerald"], :root[data-theme="dark"][data-accent="graphite"] { --accent-ink: #07130e; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
#app { height: 100%; }
body { font: 13.5px/1.5 var(--sans); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1, "cv11" 1; letter-spacing: -.003em; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.012em; }
h3 { font-size: 14px; }
.mono { font-family: var(--mono); font-size: 12px; letter-spacing: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 12px; }
.hide { display: none !important; }
.ico { display: inline-flex; width: 16px; height: 16px; flex: none; }
.ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.mark { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.mark .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 14px; letter-spacing: -.02em; flex: none; }
.mark small { display: block; font-weight: 500; font-size: 11px; opacity: .65; line-height: 1.1; margin-top: 1px; }

/* buttons and fields */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 550; line-height: 1; box-shadow: var(--shadow); transition: background .12s, border-color .12s; white-space: nowrap; }
.btn:hover { background: var(--surface-2); border-color: color-mix(in srgb, var(--ink) 28%, var(--line-2)); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--ink-2); }
.btn.ghost:hover { background: var(--sunken); color: var(--ink); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 5px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--ink-2); }
.icon-btn:hover { background: var(--sunken); color: var(--ink); }
label.fl { display: block; font-size: 12px; font-weight: 550; color: var(--ink-2); margin: 0 0 5px; }
label.fl .req { color: var(--bad); margin-left: 2px; }
.inp, select.inp, textarea.inp { width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface); transition: border-color .12s, box-shadow .12s; }
.inp::placeholder { color: var(--ink-3); }
.inp:focus { border-color: var(--accent); box-shadow: var(--ring); outline: none; }
textarea.inp { height: auto; padding: 8px 10px; font-family: var(--mono); font-size: 12px; resize: vertical; min-height: 76px; line-height: 1.5; }
input[type=range] { accent-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); }
.hint { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

/* tags, methods, status */
.pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: .01em; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: color-mix(in srgb, var(--good) 13%, transparent); color: var(--good); }
.pill.bad { background: color-mix(in srgb, var(--bad) 13%, transparent); color: var(--bad); }
.pill.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
.pill.info { background: color-mix(in srgb, var(--info) 13%, transparent); color: var(--info); }
.verb { display: inline-block; min-width: 44px; text-align: center; font-family: var(--mono); font-size: 10.5px; font-weight: 700; padding: 2px 0; border-radius: 4px; letter-spacing: .04em; border: 1px solid currentColor; background: transparent; }
.verb.GET { color: var(--info); }
.verb.POST { color: var(--good); }
.verb.PUT, .verb.PATCH { color: var(--warn); }
.verb.DELETE { color: var(--bad); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.dot.good { background: var(--good); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }

/* sign in */
.login { min-height: 100%; display: grid; grid-template-columns: minmax(340px, 5fr) 6fr; }
.login .brand { background: var(--side); color: var(--side-ink); padding: 40px clamp(28px, 5vw, 64px); display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;
  background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 32px 32px; background-position: -1px -1px; }
.login .brand::after { content: ""; position: absolute; inset: auto 0 0 0; height: 55%; background: linear-gradient(to top, var(--side), transparent); pointer-events: none; }
.login .brand > * { position: relative; z-index: 1; }
.login h1 { font-size: 30px; line-height: 1.15; color: #fff; }
.login .lede { color: var(--side-ink-2); margin: 10px 0 0; max-width: 40ch; font-size: 14px; }
.login .conn { margin-top: 30px; display: grid; gap: 1px; border: 1px solid rgba(255,255,255,.1); border-radius: 8px; overflow: hidden; background: rgba(255,255,255,.08); max-width: 420px; }
.login .conn .c { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; background: rgba(12, 22, 44, .92); font-size: 12.5px; }
.login .conn .c b { font-weight: 550; color: #fff; }
.login .conn .c span.v { color: var(--side-ink-2); font-family: var(--mono); font-size: 11.5px; }
.login .panel { display: grid; place-items: center; padding: 32px 20px; position: relative; }
.login .panel .corner { position: absolute; right: 16px; top: 16px; }
.login form { width: min(380px, 100%); }
.login form h2 { font-size: 22px; margin-bottom: 4px; }
.login .field { margin-top: 14px; }
.login .err { margin-top: 14px; padding: 10px 12px; border-radius: 6px; background: color-mix(in srgb, var(--bad) 11%, transparent); color: var(--bad); font-size: 12.5px; white-space: pre-wrap; border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); }
.login details { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; }
.login details summary { cursor: pointer; font-weight: 550; color: var(--ink-2); }
.pwbox { position: relative; }
.pwbox .icon-btn { position: absolute; right: 1px; top: 1px; width: 32px; height: 32px; }
.recent { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.recent button { font-size: 12px; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink-2); }
.recent button:hover { color: var(--ink); border-color: var(--ink-3); }

/* shell */
.shell { height: 100%; display: grid; grid-template-columns: 232px minmax(0, 1fr); grid-template-rows: 100%; }
.side { background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; min-height: 0; }
.side .mark { padding: 16px 16px 14px; color: #fff; }
.side nav { overflow-y: auto; padding: 2px 8px 12px; flex: 1; }
.side .grp { font-size: 10.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--side-ink-2); padding: 16px 10px 6px; font-weight: 600; }
.side a.nav { position: relative; display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 6px; color: var(--side-ink); text-decoration: none; cursor: pointer; font-weight: 500; }
.side a.nav .ico { opacity: .75; }
.side a.nav:hover { background: var(--side-2); }
.side a.nav.on { background: color-mix(in srgb, var(--accent) 26%, transparent); color: #fff; }
.side a.nav.on .ico { opacity: 1; }
.side a.nav.on::before { content: ""; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); }
:root[data-theme="dark"][data-accent="graphite"] .side a.nav.on { background: rgba(255,255,255,.1); }
.side .foot { padding: 10px 12px 12px; border-top: 1px solid rgba(255,255,255,.07); display: flex; gap: 6px; flex-wrap: wrap; }
.side .foot .btn { background: transparent; color: var(--side-ink); border-color: rgba(255,255,255,.14); box-shadow: none; }
.side .foot .btn:hover { background: var(--side-2); }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.top { display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--surface); flex: none; }
.top h1 { font-size: 15px; }
.env { display: inline-flex; align-items: center; gap: 7px; height: 24px; padding: 0 9px; border: 1px solid var(--line); border-radius: 5px; color: var(--ink-2); font-family: var(--mono); font-size: 11.5px; background: var(--surface-2); }
.chip { display: inline-flex; align-items: baseline; gap: 8px; padding: 0 4px; color: var(--ink-2); font-size: 12px; }
.chip .amt { font-size: 15px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.who { position: relative; }
.who > button { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 8px 0 4px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); }
.who > button:hover { background: var(--surface-2); }
.avatar { width: 24px; height: 24px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 11.5px; flex: none; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); width: 320px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: var(--pop); padding: 4px; z-index: 40; }
.menu .it { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
.menu .it:hover { background: var(--sunken); }
.menu .it.on { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.content { flex: 1; overflow-y: auto; padding: 24px; }
.content > .page { max-width: 1120px; margin: 0 auto; }
.page > .lead { color: var(--ink-2); margin: 0 0 18px; max-width: 74ch; }
.page h2.sec { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 28px 0 10px; font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; align-items: start; }
.stack { display: grid; gap: 12px; }
.tabs { display: flex; gap: 20px; flex-wrap: wrap; margin: 0 0 16px; border-bottom: 1px solid var(--line); max-width: 100%; }
.tabs button { padding: 8px 0 9px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent; font-weight: 550; color: var(--ink-2); }
.tabs button:hover { color: var(--ink); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.notice { padding: 9px 12px; border-radius: 6px; background: color-mix(in srgb, var(--info) 10%, transparent); color: var(--info); font-size: 12.5px; margin-bottom: 14px; border: 1px solid color-mix(in srgb, var(--info) 22%, transparent); }
.notice.warn { background: color-mix(in srgb, var(--warn) 11%, transparent); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 26%, transparent); }
.notice.bad { background: color-mix(in srgb, var(--bad) 10%, transparent); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 26%, transparent); }

/* panels */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
.card.pad { padding: 16px; }
details.act > summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; border-radius: 8px; min-height: 44px; }
details.act > summary:hover { background: var(--surface-2); }
details.act > summary::-webkit-details-marker { display: none; }
details.act[open] > summary { border-bottom: 1px solid var(--line); border-bottom-left-radius: 0; border-bottom-right-radius: 0; background: var(--surface-2); }
details.act > summary .t { font-weight: 600; }
details.act > summary .p { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
details.act > summary .pill { margin-left: auto; }
details.act > summary .chev { color: var(--ink-3); transition: transform .12s; }
details.act[open] > summary .chev { transform: rotate(90deg); }
.act .body { padding: 14px; display: grid; gap: 12px; }
.act .note { color: var(--ink-2); font-size: 12.5px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.fields .wide { grid-column: 1 / -1; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.result { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.result .rh { display: flex; gap: 10px; align-items: center; padding: 6px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); flex-wrap: wrap; min-height: 34px; }
.result .rh .msg { font-weight: 550; min-width: 0; overflow-wrap: anywhere; }
.result .rb { padding: 12px; max-height: 420px; overflow: auto; }
.result .rtabs { margin-left: auto; display: flex; gap: 2px; }
.result .rtabs button { height: 22px; padding: 0 8px; border: 0; border-radius: 4px; background: transparent; font-size: 12px; color: var(--ink-2); }
.result .rtabs button.on { background: var(--sunken); color: var(--ink); }
pre.json { margin: 0; padding: 10px 12px; border-radius: 6px; background: var(--code-bg); color: var(--code-ink); font: 12px/1.55 var(--mono); overflow: auto; white-space: pre-wrap; word-break: break-word; }
pre.json .k { color: #8fb6ff; } pre.json .s { color: #a8dd9a; } pre.json .n { color: #f1c27d; } pre.json .b { color: #d9a6e8; } pre.json .z { color: #7d8aa3; }
.kv { display: grid; grid-template-columns: minmax(130px, max-content) 1fr; gap: 7px 20px; }
.kv .k { color: var(--ink-2); font-size: 12.5px; }
.kv .v { overflow-wrap: anywhere; font-weight: 500; font-variant-numeric: tabular-nums; }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--ink-2); padding: 8px 10px; border-bottom: 1px solid var(--line-2); position: sticky; top: 0; background: var(--surface-2); white-space: nowrap; }
table.t td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; max-width: 260px; overflow-wrap: anywhere; }
table.t tr.clk { cursor: pointer; }
table.t tr.clk:hover td { background: var(--surface-2); }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tw { overflow: auto; border: 1px solid var(--line); border-radius: 6px; max-height: 460px; }
.tw table.t tr:last-child td { border-bottom: 0; }

/* wallet overview */
.balance { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
.balance .cell { padding: 16px 18px; border-left: 1px solid var(--line); min-width: 0; }
.balance .cell:first-child { border-left: 0; background: var(--side); color: var(--side-ink); }
.balance .lab { font-size: 11.5px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.balance .cell:first-child .lab { color: var(--side-ink-2); }
.balance .num { font-size: 30px; font-weight: 600; letter-spacing: -.025em; margin: 6px 0 8px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.balance .val { font-size: 15px; font-weight: 600; margin-top: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.balance .sub { color: var(--side-ink-2); font-size: 12px; }
.balance .btn { background: rgba(255,255,255,.1); color: var(--side-ink); border-color: rgba(255,255,255,.2); box-shadow: none; }
.balance .btn:hover { background: rgba(255,255,255,.18); }

/* escrow */
.esc { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.esc > * { min-width: 0; }
.steps { display: grid; gap: 0; }
.stepbtn { position: relative; display: grid; grid-template-columns: 24px 1fr auto; gap: 12px; align-items: center; padding: 10px 10px; border: 1px solid transparent; border-radius: 6px; background: transparent; text-align: left; width: 100%; }
.stepbtn:hover { background: var(--surface-2); border-color: var(--line); }
.stepbtn:not(:last-child)::after { content: ""; position: absolute; left: 21px; top: 38px; bottom: -10px; width: 1px; background: var(--line-2); }
.stepbtn .n { width: 24px; height: 24px; border-radius: 50%; background: var(--surface); color: var(--accent); border: 1.5px solid var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 11.5px; position: relative; z-index: 1; }
.stepbtn b { display: block; font-weight: 600; }
.stepbtn span.d { color: var(--ink-2); font-size: 12.5px; }
.stepbtn .ico { color: var(--ink-3); }
.bar { height: 6px; border-radius: 999px; background: var(--sunken); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.mathtbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; margin-top: 4px; }
.mathtbl td { padding: 6px 0; border-bottom: 1px solid var(--line); color: var(--ink-2); }
.mathtbl td:last-child { text-align: right; font-weight: 600; color: var(--ink); font-family: var(--mono); font-size: 12.5px; }
.mathtbl tr.sum td { border-bottom: 0; border-top: 1px solid var(--ink-3); color: var(--ink); font-weight: 650; padding-top: 8px; }
.tl { display: grid; gap: 0; max-height: 360px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
.tl .ev { display: grid; grid-template-columns: 38px 1fr; gap: 10px; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 12.5px; align-items: start; }
.tl .ev:last-child { border-bottom: 0; }
.tl .ev .m { color: var(--ink-2); font-size: 12px; overflow-wrap: anywhere; }
.tl .ev .pill { justify-content: center; }
.tl .empty { border: 0; }
.delta.up { color: var(--good); } .delta.down { color: var(--bad); }
.bal { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.bal:last-child { border-bottom: 0; }
.bal .fig { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }

function tabbed(items, initial) {
  // items: [{ id, label, build: () => Node }]
  const holder = h('div'); const bar = h('div', { class: 'tabs', role: 'tablist' }); const btns = {};
  const cache = {};
  const pick = id => {
    for (const [k, b] of Object.entries(btns)) b.classList.toggle('on', k === id);
    const it = items.find(i => i.id === id); if (!cache[id] || it.fresh) cache[id] = it.build();
    holder.replaceChildren(cache[id]);
  };
  for (const it of items) { btns[it.id] = h('button', { type: 'button', role: 'tab', onclick: () => pick(it.id) }, it.label); bar.append(btns[it.id]); }
  pick(initial || items[0].id);
  return h('div', null, bar, holder);
}

function scan(o, names) {
  const want = names.map(n => n.toLowerCase()); const q = [o]; let guard = 0;
  while (q.length && guard++ < 500) {
    const x = q.shift();
    if (x && typeof x === 'object') {
      for (const [k, v] of Object.entries(x)) if (want.includes(k.toLowerCase()) && v !== null && typeof v !== 'object') return v;
      for (const v of Object.values(x)) if (v && typeof v === 'object') q.push(v);
    }
  }
  return '';
}

async function checkConnections() {

  else set('origin', 'good', o.replace(/^https?:\/\//, ''));
  const r = await call({ method: 'GET', path: '/api/v1/auth/social/providers', auth: 'none' });

  else {

  ];

    h('div', { class: 'notice' }, 'The service never opens /v1 to browsers (no CORS), by design, so this page cannot send these calls itself. Copy the command and run it from a terminal or Postman. The payment operations are the wallet\'s commercial API: a path such as POST /payments there is POST /v1/sandbox/payments here.'),

      h('div', { class: 'row' }, h('span', { class: 'fl', style: { margin: 0 } }, 'Start from'), ...Object.keys(PRESETS).map(n => h('button', { class: 'btn sm', type: 'button', onclick: () => preset(n) }, n))),

        h('div', { class: 'wide' }, h('label', { class: 'fl' }, 'Path after /v1/{environment}'), path),

        h('div', { class: 'wide' }, h('label', { class: 'fl' }, 'Idempotency-Key'), idem, h('div', { class: 'hint' }, 'Repeat a call with the same key to learn the outcome after a timeout (504).')),

    const p = path.value.trim();
    const res = await call(/^https?:\/\//.test(p) ? { url: interp(p), method: method.value, body: b, headers, auth: auth.value } : { method: method.value, path: p, body: b, headers, auth: auth.value });
    send.disabled = false; out.replaceChildren(renderResult(res));
  });
  return h('div', null, lead('Send any request to the developer service with the active account\'s token. Only /api/v1 is reachable from a browser.'),
    h('div', { class: 'card pad stack' },
      h('div', { class: 'fields' },
        h('div', null, h('label', { class: 'fl' }, 'Method'), method),
        h('div', null, h('label', { class: 'fl' }, 'Authentication'), auth),
        h('div', { class: 'wide' }, h('label', { class: 'fl' }, 'Path (or full URL)'), path),
        h('div', { class: 'wide' }, h('label', { class: 'fl' }, 'Extra headers (JSON)'), hdr),
        h('div', { class: 'wide' }, h('label', { class: 'fl' }, 'Body (JSON)'), body)),
      h('div', { class: 'actions' }, send), out));
};

// ---------- error codes ----------
PAGES.errors = () => {
  const q = h('input', { class: 'inp', placeholder: 'Filter by code, status or words', spellcheck: 'false' });
  const body = h('tbody');
  const draw = () => {
    const t = q.value.trim().toLowerCase();
    body.replaceChildren(...ERRORS.filter(e => !t || (e[0] + ' ' + e[1] + ' ' + e[2]).toLowerCase().includes(t)).map(e =>
      h('tr', null, h('td', { class: 'mono' }, e[0]), h('td', null, h('span', { class: 'pill ' + (e[1] >= 500 ? 'bad' : e[1] >= 400 ? 'warn' : '') }, e[1])), h('td', null, e[2]))));
  };
  q.addEventListener('input', draw); draw();
  return h('div', null,
    lead('Errors come back as { success: false, message, data: { code, requestId } }. Quote the requestId when asking for help.'),
    h('div', { style: { marginBottom: '12px', maxWidth: '420px' } }, q),
    h('div', { class: 'tw' }, h('table', { class: 't' }, h('thead', null, h('tr', null, h('th', null, 'Code'), h('th', null, 'HTTP'), h('th', null, 'What it means'))), body)));
};

// ---------- start ----------
window.addEventListener('error', e => { try { toast('Script error: ' + e.message, true); } catch (x) { /* ignore */ } });
window.addEventListener('unhandledrejection', e => { try { toast('Unexpected error: ' + (e.reason && e.reason.message || e.reason), true); } catch (x) { /* ignore */ } });
applyTheme(S.theme);
applyAccent(S.accent);
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.theme === 'system') applyTheme('system'); });
renderApp();

</script>
</body>
</html>
